<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d29;
    --accent: #4ade80;
    --accent-dark: #22c55e;
    --food: #f87171;
    --text: #e5e7eb;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  .title {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--accent);
  }
  .scoreboard {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 420px;
  }
  .stat {
    flex: 1;
    background: var(--panel);
    border-radius: 12px;
    padding: 8px 14px;
    text-align: center;
  }
  .stat .label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .stat .value {
    font-size: 1.3rem;
    font-weight: 700;
  }
  .board-wrap {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1 / 1;
  }
  canvas {
    width: 100%;
    height: 100%;
    background: var(--panel);
    border-radius: 16px;
    display: block;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(15, 17, 23, 0.88);
    border-radius: 16px;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 1.5rem; }
  .overlay p { color: var(--muted); font-size: 0.9rem; }
  .btn {
    background: var(--accent);
    color: #06281a;
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn:active { background: var(--accent-dark); }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 64px);
    gap: 8px;
  }
  .dpad button {
    background: var(--panel);
    color: var(--accent);
    border: none;
    border-radius: 14px;
    font-size: 1.5rem;
    cursor: pointer;
  }
  .dpad button:active { background: #2a2e3d; }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 3; }
  .dpad .pause {
    grid-column: 2; grid-row: 2;
    background: transparent;
    color: var(--muted);
    font-size: 1.1rem;
  }
  .hint { color: var(--muted); font-size: 0.75rem; }
</style>
</head>
<body>
  <div class="title">SNAKE</div>

  <div class="scoreboard">
    <div class="stat">
      <div class="label">Puntos</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="stat">
      <div class="label">Récord</div>
      <div class="value" id="best">0</div>
    </div>
  </div>

  <div class="board-wrap">
    <canvas id="game" width="420" height="420"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Snake</h2>
      <p id="overlay-text">Desliza o usa los botones para moverte</p>
      <button class="btn" id="start-btn">Jugar</button>
    </div>
  </div>

  <div class="dpad">
    <button class="up"    data-dir="up"   aria-label="Arriba">▲</button>
    <button class="left"  data-dir="left" aria-label="Izquierda">◀</button>
    <button class="pause" id="pause-btn"  aria-label="Pausa">⏸</button>
    <button class="right" data-dir="right" aria-label="Derecha">▶</button>
    <button class="down"  data-dir="down" aria-label="Abajo">▼</button>
  </div>

  <div class="hint">Flechas / WASD en escritorio · desliza en móvil</div>

<script>
(function () {
  const GRID = 20;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const startBtn = document.getElementById('start-btn');
  const pauseBtn = document.getElementById('pause-btn');

  let cell = canvas.width / GRID;
  let snake, dir, nextDir, food, score, best, state, tickMs, lastTick;

  best = parseInt(localStorage.getItem('snake-best') || '0', 10);
  bestEl.textContent = best;

  function resizeCanvas() {
    const size = Math.round(canvas.clientWidth);
    canvas.width = size;
    canvas.height = size;
    cell = size / GRID;
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    tickMs = 140;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function setDir(name) {
    const map = {
      up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
      left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
    };
    const d = map[name];
    if (!d) return;
    if (d.x === -dir.x && d.y === -dir.y) return; // no reversa
    nextDir = d;
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (tickMs > 70) tickMs -= 4;
      placeFood();
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // comida
    ctx.fillStyle = '#f87171';
    roundRect(food.x * cell, food.y * cell, cell, cell, cell * 0.32);
    ctx.fill();

    // serpiente
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
      roundRect(s.x * cell + 1, s.y * cell + 1, cell - 2, cell - 2, cell * 0.28);
      ctx.fill();
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function loop(now) {
    if (state !== 'playing') return;
    if (now - lastTick >= tickMs) {
      lastTick = now;
      tick();
    }
    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    resizeCanvas();
    reset();
    state = 'playing';
    overlay.classList.add('hidden');
    lastTick = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    state = 'over';
    if (score > best) {
      best = score;
      localStorage.setItem('snake-best', String(best));
      bestEl.textContent = best;
    }
    overlayTitle.textContent = 'Game Over';
    overlayText.textContent = 'Puntuación: ' + score;
    startBtn.textContent = 'Jugar de nuevo';
    overlay.classList.remove('hidden');
    draw();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      overlayTitle.textContent = 'Pausa';
      overlayText.textContent = 'Puntuación: ' + score;
      startBtn.textContent = 'Continuar';
      overlay.classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'playing';
      overlay.classList.add('hidden');
      lastTick = performance.now();
      requestAnimationFrame(loop);
    }
  }

  startBtn.addEventListener('click', () => {
    if (state === 'paused') togglePause();
    else startGame();
  });
  pauseBtn.addEventListener('click', togglePause);

  document.querySelectorAll('.dpad button[data-dir]').forEach(b => {
    b.addEventListener('click', () => setDir(b.dataset.dir));
  });

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const keymap = {
      arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down',
      arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right'
    };
    if (keymap[k]) { e.preventDefault(); setDir(keymap[k]); }
    if (k === ' ') { e.preventDefault(); togglePause(); }
  });

  // gestos tactiles
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) { touchStart = null; return; }
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'right' : 'left');
    else setDir(dy > 0 ? 'down' : 'up');
    touchStart = null;
  }, { passive: true });

  window.addEventListener('resize', () => {
    if (state !== 'playing') { resizeCanvas(); draw(); }
  });

  // estado inicial
  state = 'idle';
  resizeCanvas();
  reset();
  draw();
})();
</script>
</body>
</html>
